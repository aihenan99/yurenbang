name: 安全扫描

# 定位：与「工程验证」互补的安全哨兵，三条触发线——
#   1) 每次 push / PR：改了依赖或提交了密钥，当场报
#   2) 每周一定时：依赖披露是持续事件，代码不动也可能变不安全
#   3) 手动：workflow_dispatch，排查时可单跑
#
# 为什么依赖只有 npm audit：本项目刻意零 npm 依赖（工具全是 Node 内置模块 +
# 自带 Playwright），所以这条现在几乎必然通过。它的价值是「未来有人加依赖时
# 自动接上审计」，以及 package-lock.json 让依赖树可复现。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 21 * * 1" # 每周一 05:17（北京时间）体检
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps-audit:
    name: 依赖漏洞（npm audit）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成锁文件（项目当前零依赖，为将来加依赖留审计入口）
        run: npm install --package-lock-only --ignore-scripts

      - name: 审计高危及以上漏洞
        run: npm audit --audit-level=high

  secrets-scan:
    name: 泄密扫描（gitleaks 全历史）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出代码（全历史，历史里的密钥同样要抓）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 gitleaks（固定版本 + 3 次重试）
        # 为什么不用 gitleaks/gitleaks-action：它在运行时自行去 Releases 拉二进制，
        # 拉取失败/被限流时只会把整步标红，看不到到底命中了什么。自己装、自己跑，
        # 日志里能直接看到 RuleID / 文件 / 行号，排查才有依据。
        # 为什么死锁版本：allowlist 配置语义随版本变过（8.25 起才有多张 [[allowlists]]），
        # 版本漂移会让白名单**静默失效**——"明明放行了还红"就是这么来的。
        run: |
          set -euo pipefail
          V=8.24.3
          file="gitleaks_${V}_linux_x64.tar.gz"
          for i in 1 2 3; do
            if curl -fsSL --retry 3 -o "$file" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${file}"; then
              break
            fi
            echo "下载失败，$((i*5))s 后重试（第 $i 次）"; sleep $((i*5))
          done
          tar -xzf "$file" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 全历史扫描（输出 JSON 报告）
        # --log-opts=--all：扫全部历史提交，不只这次改动的 diff（历史里的密钥同样要抓）
        # 不管退出码，由下一步统一判定——这样"扫描没跑起来"和"确实命中"能区分开
        run: |
          set +e
          gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" \
            --redact --no-banner
          echo "gitleaks 退出码 $?"

      - name: 汇报命中项（日志 + Job Summary + 注解）
        # 命中项转成 ::error 注解：公开仓库页面不登录也能看到规则/文件/行号
        if: always()
        run: python3 scripts/gitleaks-report.py "$RUNNER_TEMP/gitleaks.json"

  # 说明：GitHub 自带的 Secret scanning / Push protection 是仓库设置项，
  # 无法用 workflow 打开。公开仓库默认开启 secret scanning；开启方式见
  # docs/安全基线.md「GitHub 侧必须手动打开的两项」。
