# 育人帮 · 站点安全响应头（被站点配置 include，各 location 需各自 include）
# 来源：deploy-cn/_worker.js 的 secure()，逐条等价
# __BUILD__ 由 install.sh 替换为 build.json 里的构建号

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-YRB-Edge "__BUILD__" always;

# CSP：与 worker 的 CSP_POLICY 完全一致，先保持 Report-Only（不阻断，只报违规）
# 转强制：把下面这行的名字改成 Content-Security-Policy（worker 里同款预案）
# 纯静态页 /anli/、/share.html 在 worker 里已单独转强制，nginx 侧暂未拆分——
# 等域名备案完成、站点正式对外前再按路径拆（预案见 docs/CSP转强制预案.md）
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval' 'sha256-WSR3JsBOi1ku91HBvFogs6slXsjcLEp2xrq2WzB/6Mg=' 'sha256-MsIHKWwAkOqHuy+fS8Dh6+h8aIJ9trABD9s34o3VFi0=' 'sha256-4Af4t/iEQUgw37MgnPKy3KbnTbaaP0NhuLE9rncYZGM=' 'sha256-PwOZ9r7SB3z+7SEQtn2TQ4eugxNK+o6fhQ6J7lzc8n4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
