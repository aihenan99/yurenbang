<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>页面没找到 · 育人帮</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#3B2E26;--muted:#8C8078;--accent:#F0543C;--grad:linear-gradient(135deg,#FF8A5C,#F0543C)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#FFE9DB 0%,#FFF9F3 34%);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:440px;background:#fff;border-radius:24px;box-shadow:0 14px 44px rgba(70,45,30,.1);padding:30px 24px;text-align:center}
.e{font-size:46px}
h1{font-size:19px;margin:12px 0 8px}
p{color:var(--muted);font-size:13.5px;line-height:1.95}
a.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:999px;padding:15px;margin-top:20px;font-size:16px;font-weight:800;background:var(--grad);color:#fff;text-decoration:none;box-shadow:0 10px 26px rgba(240,84,60,.3)}
footer{color:var(--muted);font-size:11.5px;line-height:1.9;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="e">🧭</div>
  <h1>这个页面没找到</h1>
  <p>可能是链接写错了，或者这个页面已经调整。别担心，点下面按钮回到育人帮首页就好。</p>
  <a class="go" href="/">🏠 回到育人帮首页</a>
  <footer>育人帮 · 家长互助社区<br>关心下一代，呵护成长</footer>
</div>
</body>
</html>
